<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرح بلدنا | للمحاصيل الزراعية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --black:#0d0d0d;        /* خلفية أساسية سمراء */
  --dark:#121212;         /* خلفية أقسام */
  --blue:#003366;         /* كحلي للأيقونات والعناصر */
  --light:#f0f0f0;        /* كتابة فاتحة */
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:var(--black);
  color:var(--light);
  line-height:1.8;
}

/* بانر */
.top-banner{
  background: linear-gradient(90deg, var(--blue), #001a33, var(--black));
  text-align: center;
  padding: 15px;
  font-weight: 900;
  color: var(--light);
  font-size: 18px;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}
.top-banner span{
  display: inline-block;
  animation: bannerMove 6s linear infinite;
}
@keyframes bannerMove {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}

/* هيدر */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(6px);
  border-bottom:1px solid #222;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:var(--blue);
}

nav a{
  color:var(--light);
  text-decoration:none;
  margin-right:15px;
  font-weight:700;
}
nav a:hover{color:var(--blue)}

/* هيرو */
.hero{
  min-height:85vh;
  background:
  linear-gradient(to left,rgba(0,0,0,.8),rgba(0,0,0,.6)),
  url("images/hero.jpg") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:42px;
  font-weight:900;
}
.hero span{color:var(--blue)}
.hero p{max-width:600px;margin:20px auto}

.hero .btn{
  background:var(--blue);
  padding:14px 30px;
  color:var(--light);
  text-decoration:none;
  border-radius:40px;
  font-weight:900;
  display:inline-block;
}
.hero .btn:hover{background:#001a33}

/* أقسام */
section{
  padding:70px 20px;
  max-width:1200px;
  margin:auto;
}

.section-title{
  text-align:center;
  font-size:32px;
  color:var(--blue);
  margin-bottom:40px;
  font-weight:900;
}

/* منتجات */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
}

.product{
  background:var(--dark);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  transition:.3s;
  position:relative;
}
.product:hover{transform:translateY(-8px)}

.product img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.product .info{
  padding:20px;
  text-align:center;
}

.product h3{color:var(--blue);margin-bottom:10px}

.add-cart{
  background:var(--blue);
  color:var(--light);
  padding:10px 20px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:700;
  margin-top:10px;
}
.add-cart:hover{background:#001a33}

/* صور إضافية */
.product-gallery{
  display:flex;
  gap:10px;
  padding:10px;
  justify-content:center;
}
.product-gallery img{
  width:30%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #333;
  cursor:pointer;
}

/* العلامة المائية */
.product::after {
  content: "طرح بلدنا";
  position: absolute;
  bottom: 10px;
  right: 10px;
  font-size: 18px;
  font-weight: 900;
  color: rgba(0,51,102,0.4); /* كحلي شفاف */
  pointer-events: none;
}

/* السلة */
.cart{
  background:var(--dark);
  padding:20px;
  border-radius:20px;
  margin-top:40px;
}
.cart h3{color:var(--blue)}
.cart ul{list-style:none;padding:0}
.cart li{margin:8px 0}
.cart button{
  background:var(--blue);
  color:var(--light);
  padding:12px 25px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:900;
  margin-top:15px;
}
.cart button:hover{background:#001a33}

/* لماذا نحن */
.trust{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
}

.trust-card{
  background:var(--dark);
  padding:30px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:.3s;
}

.trust-card:hover{
  transform:translateY(-6px);
}

.trust-card h3{
  color:var(--blue);
  margin-bottom:10px;
  font-size:22px;
}

.trust-card p{
  font-size:15px;
  color:var(--light);
}

/* تواصل */
.contact{
  background:var(--dark);
  border-radius:20px;
  padding:40px;
  text-align:center;
}

.contact a{
  display:inline-block;
  margin-top:15px;
  background:var(--blue);
  padding:12px 25px;
  border-radius:30px;
  color:var(--light);
  text-decoration:none;
  font-weight:900;
}
.contact a:hover{background:#001a33}

/* فوتر */
footer{
  background:#000;
  padding:25px;
  text-align:center;
  color:#888;
}

  nav{disp
