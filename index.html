<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرح بلدنا | Tarh Baldna</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#f5f5f5; /* off white */
  color:#222;
}

/* ===== الهيدر ===== */
header{
  background:#ffffff;
  padding:12px 20px;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

/* ===== زر الثلاث نقاط ===== */
.menu-btn{
  font-size:26px;
  cursor:pointer;
  color:#777;
  user-select:none;
}

/* ===== Dropdown ===== */
.dropdown{
  position:absolute;
  top:60px;
  left:15px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  width:220px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  display:none;
  z-index:2000;
}

.dropdown a{
  display:block;
  padding:12px 16px;
  color:#333;
  text-decoration:none;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.dropdown a:last-child{border-bottom:none;}
.dropdown a:hover{background:#f0f0f0;}

/* ===== عنوان ===== */
header h1{
  margin:0;
  font-size:20px;
  color:#444;
}

/* ===== المنتجات ===== */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:30px;
}

.product{
  background:#fff;
  width:240px;
  border-radius:18px;
  padding:15px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.product img.main-img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
}

.product h2{
  color:#444;
  margin:10px 0 5px;
  font-size:18px;
}

.product button{
  background:#777;
  border:none;
  padding:8px 14px;
  color:#fff;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:8px;
}

/* ===== صور مصغرة ===== */
.product-gallery{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:10px;
}
.product-gallery img{
  width:55px;
  height:55px;
  border-radius:8px;
  cursor:pointer;
  border:2px solid transparent;
}
.product-gallery img.selected{
  border-color:#777;
}

/* ===== السلة ===== */
.cart{
  position:fixed;
  right:20px;
  top:80px;
  width:260px;
  background:#fff;
  border-radius:15px;
  padding:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
  display:none;
  z-index:1500;
}
.cart h3{margin-top:0;color:#444;}
.cart ul{padding:0;list-style:none;}
.cart li{background:#f3f3f3;margin-bottom:6px;padding:6px;border-radius:8px;}
.cart button{
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#777;
  color:#fff;
  cursor:pointer;
}

/* ===== Lightbox ===== */
.lightbox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:3000;
}
.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:15px;
}
</style>
</head>

<body>

<header>
  <!-- الثلاث نقاط شمال -->
  <div class="menu-btn" onclick="toggleMenu()">⋮</div>

  <h1>طرح بلدنا</h1>

  <div onclick="toggleCart()" style="cursor:pointer;color:#777;font-size:22px">🛒</div>
</header>

<!-- Dropdown -->
<div class="dropdown" id="dropdown">
  <a href="#products">📦 المنتجات</a>
  <a href="#products">🧺 الفئات</a>
  <a href="javascript:void(0)" onclick="openAbout()">ℹ عن الشركة</a>
  <a href="mailto:tarhbladna@gmail.com">✉ المساعدة</a>
</div>

<!-- السلة -->
<div class="cart" id="cart">
  <h3>سلة الطلب</h3>
  <ul id="items"></ul>
  <button onclick="send()">طلب واتساب</button>
  <button onclick="clearCart()">تفريغ</button>
</div>

<!-- المنتجات -->
<div class="products" id="products">

<div class="product">
<img class="main-img" src="images/peanut-shell-1.jpg" onclick="openLightbox(this)">
<h2>فول سوداني بقشره</h2>
<button onclick="add('فول سوداني بقشره')">أضف للسلة</button>
<div class="product-gallery">
<img src="images/peanut-shell-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-shell-2.jpg" onclick="changeMainImage(this)">
<img src="images/peanut-shell-3.jpg" onclick="changeMainImage(this)">
</div>
</div>

<div class="product">
<img class="main-img" src="images/peanut-shelled-1.jpg" onclick="openLightbox(this)">
<h2>فول سوداني مقشر</h2>
<button onclick="add('فول سوداني مقشر')">أضف للسلة</button>
<div class="product-gallery">
<img src="images/peanut-shelled-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-shelled-2.jpg" onclick="changeMainImage(this)">
<img src="images/peanut-shelled-3.jpg" onclick="changeMainImage(this)">
</div>
</div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<script>
let cart=[];

function toggleMenu(){
  const d=document.getElementById('dropdown');
  d.style.display=d.style.display==='block'?'none':'block';
}

function add(item){
  cart.push(item);
  renderCart();
}

function renderCart(){
  let ul=document.getElementById('items');
  ul.innerHTML='';
  cart.forEach(i=>{
    let li=document.createElement('li');
    li.textContent=i;
    ul.appendChild(li);
  });
}

function toggleCart(){
  const c=document.getElementById('cart');
  c.style.display=c.style.display==='block'?'none':'block';
}

function clearCart(){cart=[];renderCart();}

function send(){
  if(cart.length===0){alert('السلة فارغة');return;}
  let msg='طلب جديد:\n'+cart.join('\n');
  window.open('https://wa.me/201126773698?text='+encodeURIComponent(msg),'_blank');
}

function openLightbox(el){
  document.getElementById('lightbox-img').src=el.src;
  document.getElementById('lightbox').style.display='flex';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
}
function changeMainImage(el){
  const p=el.closest('.product');
  p.querySelector('.main-img').src=el.src;
  p.querySelectorAll('.product-gallery img').forEach(i=>i.classList.remove('selected'));
  el.classList.add('selected');
}

function openAbout(){
  alert('شركة طرح بلدنا\nبيع وتجارة الفول السوداني بأنواعه');
}
</script>

</body>
</html>
