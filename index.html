<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرح بلدنا | للمحاصيل الزراعية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --black:#0d0d0d;        /* خلفية أساسية سمراء */
  --dark:#121212;         /* خلفية أقسام */
  --blue:#003366;         /* كحلي للأيقونات والعناصر */
  --light:#f0f0f0;        /* كتابة فاتحة */
  --gold:#d4af37;         /* ذهبي */
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:var(--black);
  color:var(--light);
  line-height:1.8;
}

/* بانر */
.top-banner{
  background: linear-gradient(90deg, var(--blue), #001a33, var(--black));
  text-align: center;
  padding: 15px;
  font-weight: 900;
  color: var(--light);
  font-size: 18px;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}
.top-banner span{
  display: inline-block;
  animation: bannerMove 6s linear infinite;
}
@keyframes bannerMove {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}

/* هيدر */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(6px);
  border-bottom:1px solid #222;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:var(--blue);
}

nav a{
  color:var(--light);
  text-decoration:none;
  margin-right:15px;
  font-weight:700;
}
nav a:hover{color:var(--blue)}

/* هيرو */
.hero{
  min-height:85vh;
  background:
  linear-gradient(to left,rgba(0,0,0,.8),rgba(0,0,0,.6)),
  url("images/hero.jpg") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:42px;
  font-weight:900;
}
.hero span{color:var(--blue)}
.hero p{max-width:600px;margin:20px auto}

.hero .btn{
  background:var(--blue);
  padding:14px 30px;
  color:var(--light);
  text-decoration:none;
  border-radius:40px;
  font-weight:900;
  display:inline-block;
}
.hero .btn:hover{background:#001a33}

/* قسم السلايدر */
.slider-section {
  background: var(--black);
  padding: 50px 20px;
  text-align: center;
}

.slider {
  max-width: 90%;
  margin: auto;
  overflow: hidden;
  position: relative;
  border: 2px solid var(--blue);
  border-radius: 12px;
}

.slides {
  display: flex;
  width: 400%;
  animation: slide 12s infinite;
}

.slides img {
  width: 100%;
  object-fit: cover;
}

@keyframes slide {
  0%   {transform: translateX(0);}
  25%  {transform: translateX(-100%);}
  50%  {transform: translateX(-200%);}
  75%  {transform: translateX(-300%);}
  100% {transform: translateX(0);}
}

.slider-caption {
  margin-top: 20px;
  font-size: 20px;
  color: var(--gold);
  font-weight: 900;
}

/* فوتر */
footer{
  background:#000;
  padding:25px;
  text-align:center;
  color:#888;
}
</style>
</head>
<body>

<div class="top-banner"><span>مرحبا بكم في طرح بلدنا</span></div>

<header>
  <div class="header-inner">
    <div class="logo">طرح بلدنا</div>
    <nav>
      <a href="#products">منتجات</a>
      <a href="#trust">لماذا نحن</a>
      <a href="#contact">تواصل</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div>
    <h1>أفضل <span>المحاصيل الزراعية</span> من بلدنا</h1>
    <p>نقدم لكم أجود أنواع الفول السوداني والمحاصيل الزراعية بأعلى جودة ومعايير.</p>
    <a href="#products" class="btn">تسوق الآن</a>
  </div>
</section>
<!-- قسم السلايدر -->
<section class="slider-section">
  <h2 class="section-title">بانرات منتجات طرح بلدنا</h2>
  <div class="slider">
    <div class="slides">
      <img src="https://copilot.microsoft.com/th/id/BCO.881d3fff-2602-4dbb-8984-1de6cd9da290.png" alt="بانر 1">
      <img src="https://copilot.microsoft.com/th/id/BCO.ef99397f-12a7-4262-b3e5-d2a075b541ba.png" alt="بانر 2">
      <img src="https://copilot.microsoft.com/th/id/BCO.efb2a26e-4ef6-4270-ae66-e7ca01770006.png" alt="بانر 3">
      <img src="https://copilot.microsoft.com/th/id/BCO.66d5a037-acc1-41cb-87d1-42951a0c1643.png" alt="بانر 4">
    </div>
  </div>
  <div class="slider-caption">
    اتصل بنا: 01020508423 - 01126773698
  </div>
</section>

<footer>
  <p>© 2026 طرح بلدنا - جميع الحقوق محفوظة</p>
</footer>

</body>
</html>
